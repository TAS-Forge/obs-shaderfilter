name: HDR contracts and OBS 32.2.2 Windows build
on:
  push:
    branches: [hdr-obs-32.2.2-ci]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/run_tests.py --cc cc
      - run: python3 tests/mutation_checks.py --cc cc
  windows-build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install task-local build tools
        run: python -m pip install cmake==4.3.1 ziglang==0.15.1
      - name: CPU/mock regressions (not GPU validation)
        shell: pwsh
        run: |
          $zig = python -c "import pathlib,ziglang; print(pathlib.Path(ziglang.__file__).parent / 'zig.exe')"
          python tests/run_tests.py --cc "`"$($zig.Replace('\','/'))`" cc"
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed' }
      - name: Build script argument and packaging smoke test
        shell: pwsh
        run: ./tests/build-script.Tests.ps1
      - name: Build against pinned OBS 32.2.2
        shell: pwsh
        run: ./tools/build-windows-hdr.ps1 -BuildRoot '${{ runner.temp }}/shaderfilter-hdr'
      - uses: actions/upload-artifact@v4
        with:
          name: obs-shaderfilter-hdr-windows-x64-unsigned
          path: ${{ runner.temp }}/shaderfilter-hdr/package
          if-no-files-found: error

